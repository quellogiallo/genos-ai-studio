name: Probe CORS (temporaneo)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://dexie.cloud/token https://dexie.cloud/create-db; do
            echo "== OPTIONS $u"
            curl -s -i -X OPTIONS "$u" -H "Origin: https://quellogiallo.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,authorization" | grep -i -E "^HTTP|access-control" || true
          done
          echo "== POST token (empty body)"
          curl -s -i -X POST https://dexie.cloud/token -H "Origin: https://quellogiallo.github.io" -H "content-type: application/json" -d '{}' | grep -i -E "^HTTP|access-control" || true
